<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duan Lee Dom | Redes Sociais</title>
<meta name="description" content="Criador de conteúdo, editor de vídeo e desenvolvedor. Todos os canais e redes do Duan Lee Dom em um só lugar.">
<meta name="theme-color" content="#050a14">
<meta property="og:type" content="website">
<meta property="og:title" content="Duan Lee Dom | Redes Sociais">
<meta property="og:description" content="Todos os meus canais e redes em um só lugar.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050a14'/%3E%3Crect x='14' y='14' width='36' height='36' rx='6' fill='none' stroke='%2322d3ee' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a14;--c1:#22d3ee;--c2:#3b82f6;--c3:#34d399;--txt:#e8f1ff;--mut:#8aa0bf;--glass:rgba(12,22,42,.6);--line:rgba(120,190,255,.16)}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(3px);opacity:.6}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,rgba(5,10,20,.55) 0%,rgba(5,10,20,.25) 45%,var(--bg) 100%)}
main{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:48px 20px 40px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:34px;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.avatar{width:132px;height:132px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c1));animation:spin 8s linear infinite;box-shadow:0 0 50px rgba(34,211,238,.35)}
.avatar>div{width:100%;height:100%;border-radius:50%;background:var(--bg);overflow:hidden;display:grid;place-items:center;animation:spin 8s linear infinite reverse}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .mono{font:700 2.4rem 'Space Grotesk',sans-serif;background:linear-gradient(135deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin-top:22px;font:700 clamp(1.8rem,5vw,2.6rem) 'Space Grotesk',sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,var(--c1) 60%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{margin-top:8px;color:var(--c1);font-size:.9rem;letter-spacing:.04em}
.sub{margin-top:10px;color:var(--mut);max-width:460px;line-height:1.5}
.badge{margin-top:14px;display:inline-flex;gap:8px;align-items:center;font-size:.8rem;color:var(--mut);border:1px solid var(--line);background:var(--glass);padding:6px 12px;border-radius:99px;backdrop-filter:blur(10px)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--c3);box-shadow:0 0 10px var(--c3);animation:pulse 1.8s infinite}
.gt{display:flex;align-items:center;gap:12px;margin:30px 4px 14px;font:600 .78rem 'Space Grotesk',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.gt::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;perspective:1000px}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;text-decoration:none;color:var(--txt);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .15s ease-out,border-color .3s,box-shadow .3s;opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;overflow:hidden}
.card.feat{grid-column:1/-1;padding:18px;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(52,211,153,.1)),var(--glass);border-color:rgba(34,211,238,.35)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(34,211,238,.22),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover,.card:focus-visible{border-color:rgba(34,211,238,.6);box-shadow:0 18px 40px -12px rgba(34,211,238,.35),0 0 0 1px rgba(34,211,238,.25) inset;outline:none}
.card:hover::before,.card:focus-visible::before{opacity:1}
.ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#fff;transform:translateZ(30px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.ico img{width:28px;height:28px;object-fit:contain}
.ico b{color:#0b1220;font:700 1.1rem 'Space Grotesk',sans-serif}
.txt{min-width:0;transform:translateZ(18px)}
.txt strong{display:block;font:600 1rem 'Space Grotesk',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt span{display:block;margin-top:2px;font-size:.78rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;flex:none;color:var(--c1);opacity:.4;transition:.3s;transform:translateZ(20px)}
.card:hover .arrow{opacity:1;transform:translateZ(20px) translateX(4px)}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:38px}
.btn{font:600 .95rem Inter,sans-serif;text-decoration:none;cursor:pointer;padding:12px 26px;border-radius:12px;transition:transform .2s,box-shadow .2s}
.btn.p{color:#04121f;border:0;background:linear-gradient(90deg,var(--c1),var(--c3));box-shadow:0 10px 30px -8px rgba(34,211,238,.6)}
.btn.s{color:var(--txt);background:var(--glass);border:1px solid var(--line)}
.btn:hover{transform:translateY(-3px) scale(1.03)}
footer{margin-top:44px;text-align:center;font-size:.8rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:10px;background:var(--c2);color:#fff;font-size:.9rem;transition:.4s;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}

.prod{position:relative;animation:rise .6s cubic-bezier(.2,.8,.2,1) .3s both}
.pt{position:relative;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px}
.pt::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;grid-template-columns:260px 1fr;align-items:center;gap:26px;padding:22px;border-radius:18px;background:linear-gradient(120deg,rgba(59,130,246,.14),rgba(52,211,153,.08)),var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cover{justify-self:center;--arn:.75;--maxw:260px;--maxh:230px;flex:none;width:min(var(--maxw),calc(var(--maxh)*var(--arn)));aspect-ratio:var(--arn);border-radius:10px;overflow:hidden;box-shadow:0 20px 40px -10px rgba(0,0,0,.65),0 0 34px rgba(34,211,238,.22);transform:perspective(700px) rotateY(-12deg);transition:transform .45s}
.slide:hover .cover{transform:perspective(700px) rotateY(0) scale(1.04)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;padding:10px;background:linear-gradient(145deg,var(--c2),var(--c1) 60%,var(--c3));color:#04121f;font:700 1.1rem 'Space Grotesk',sans-serif}
.info{min-width:0;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.68rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.chip.ok{color:#04121f;background:var(--c3);border-color:transparent}
.chip.soon{color:#fbbf24;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1)}
.info h3{margin-top:12px;font:700 1.35rem 'Space Grotesk',sans-serif;letter-spacing:-.01em}
.info p{margin-top:8px;color:var(--mut);font-size:.9rem;line-height:1.55}
.buyrow{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:16px}
.preco{font:700 1.5rem 'Space Grotesk',sans-serif;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.old{color:var(--mut);text-decoration:line-through;font-size:.9rem}
.btn.d{opacity:.55;cursor:not-allowed;color:var(--txt);background:var(--glass);border:1px dashed var(--line)}
.btn.d:hover{transform:none}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.ctrl button.ar{width:36px;height:36px;padding:0;border-radius:50%;font-size:1.1rem;color:var(--txt);background:var(--glass);border:1px solid var(--line);box-shadow:none}
.ctrl button.ar:hover{border-color:var(--c1);transform:scale(1.08)}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);cursor:pointer;transition:.3s}
.dots i.on{width:24px;background:linear-gradient(90deg,var(--c1),var(--c3))}
@media(max-width:640px){.slide{display:flex;flex-direction:column;text-align:center;gap:18px;padding:20px 16px}.slide .chips,.slide .buyrow{justify-content:center}.cover{--maxw:min(100%,300px);--maxh:240px}}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{font:600 .8rem Inter,sans-serif;padding:7px 14px;border-radius:99px;color:var(--mut);background:var(--glass);border:1px solid var(--line);cursor:pointer;box-shadow:none}
.pill:hover{transform:translateY(-2px);box-shadow:none;border-color:var(--c1)}
.pill.on{color:#04121f;background:linear-gradient(90deg,var(--c1),var(--c3));border-color:transparent}
.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{display:grid;grid-template-columns:124px 1fr;gap:16px;align-items:start;padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .3s,transform .3s}
.pcard:hover{border-color:rgba(34,211,238,.5);transform:translateY(-4px)}
.pcard[hidden]{display:none}
.pcard .cover{--maxw:124px;--maxh:118px;transform:perspective(600px) rotateY(-10deg)}
.pcard:hover .cover{transform:perspective(600px) rotateY(0) scale(1.04)}
.pcard .info h3{font-size:1.05rem;margin-top:8px}
.pcard .info p{font-size:.82rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .buyrow{margin-top:12px;gap:10px}
.pcard .preco{font-size:1.15rem}
.pcard .btn{padding:8px 16px;font-size:.85rem}
@media(max-width:640px){.catalog{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:640px){main{padding-top:32px}.grid{grid-template-columns:1fr}.avatar{width:112px;height:112px}}
@media(hover:none){.card{transform:none!important}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="vignette"></div>
<main>
  <section class="hero">
    <div class="avatar"><div id="av"></div></div>
    <h1>Duan Lee Dom</h1>
    <p class="role">CRIADOR DE CONTEÚDO · EDITOR DE VÍDEO · DESENVOLVEDOR</p>
    <p class="sub">Seja bem-vindo às minhas redes sociais. Escolha abaixo onde quer me acompanhar.</p>
    <span class="badge"><i></i>Todos os meus canais em um só lugar</span>
  </section>
  <div id="links"></div>
  <div class="actions" id="actions"><button class="btn p" id="share">Compartilhar esta página</button></div>
  <footer>© <span id="yr"></span> Duan Lee Dom. Todos os direitos reservados.</footer>
</main>
<div id="toast">Link copiado!</div>

<script>
/* ===================== EDITE AQUI =====================
   REDES é uma lista de SEÇÕES. Cada seção tem:
     titulo  → o título que aparece (deixe "" para uma seção sem título)
     links   → a lista de links daquela seção
     destaque:true (opcional) → cards grandes, um por linha
     {produtos:true, titulo:"..."} → no lugar de links, mostra o carrossel de PRODUTOS (mais abaixo)
     {catalogo:true, titulo:"..."} → mostra todos os PRODUTOS em grade com filtro por tipo
   Cada link tem: nome, url e sub (texto pequeno, opcional). O ícone é automático.

   PARA CRIAR UMA SEÇÃO NOVA, copie este modelo e cole onde quiser (a ordem da lista = a ordem na página):
   {titulo:"Meu título", links:[
     {nome:"Nome do link", url:"https://...", sub:"texto pequeno"},
   ]},
   PARA ADICIONAR UM LINK: coloque uma linha nova dentro de "links" da seção desejada.
   PARA MOVER UM LINK: recorte a linha e cole em outra seção. ===================== */
const EMAIL=""; /* ex.: "contato@seusite.com" — se preencher, aparece o botão Contato */
const FOTOS=["https://unavatar.io/linkedin/duanleedom","./me.png"];

const REDES=[
 {titulo:"", destaque:true, links:[
   {nome:"Portfólio | Programador e Desenvolvedor",url:"https://portfolio-beta-taupe-92.vercel.app/",sub:"Projetos e trabalhos"},
   {nome:"Portfólio | Editor de Vídeo",url:"https://duan-lee-dom-editor.ai.studio",sub:"Edições e trabalhos em vídeo"},
 ]},
 {produtos:true, titulo:"Livros e cursos"}, /* ← carrossel de produtos; mova esta linha para mudar a posição */
 {titulo:"Profissional", links:[
   {nome:"LinkedIn",url:"https://www.linkedin.com/in/duanleedom/",sub:"Perfil profissional"},
   {nome:"GitHub",url:"https://github.com/DuanLeeDom",sub:"Código e projetos"},
 ]},
 {titulo:"Vídeos", links:[
   {nome:"DuanLeeDom",url:"https://www.youtube.com/@DuanLeeDom",sub:"Canal no YouTube"},
   {nome:"LeeTechCode",url:"https://www.youtube.com/@leetechcode",sub:"Canal no YouTube"},
   {nome:"PodDom",url:"https://www.youtube.com/@poddom",sub:"Canal no YouTube"},
   {nome:"CatFat Official",url:"https://www.youtube.com/@catfat_official",sub:"Canal no YouTube"},
   {nome:"COS.TV",url:"https://cos.tv/channel/18630442609715200/",sub:"Canal no COS.TV"},
 ]},
 {titulo:"Lives", links:[
   {nome:"Twitch",url:"https://www.twitch.tv/duan_lee_dom",sub:"Lives"},
 ]},
 {titulo:"Redes sociais", links:[
   {nome:"Instagram",url:"https://www.instagram.com/duan_lee_dom",sub:"@duan_lee_dom"},
   {nome:"TikTok",url:"https://www.tiktok.com/@duan_lee_dom",sub:"@duan_lee_dom"},
   {nome:"X / Twitter",url:"https://x.com/duanleedom",sub:"@duanleedom"},
   {nome:"Facebook",url:"https://www.facebook.com/duanleedom",sub:"Perfil"},
   {nome:"Pinterest",url:"https://pinterest.com/duanleedom/",sub:"Inspirações"},
 ]},
 {titulo:"Música", links:[
   {nome:"SoundCloud",url:"https://soundcloud.com/duan-lee-dom",sub:"{-CatFat-}"},
 ]},
 {catalogo:true, titulo:"Catálogo completo"}, /* ← todos os PRODUTOS em grade, com filtro; mova esta linha para mudar a posição */
];

/* ===================== PRODUTOS (livros, cursos, qualquer coisa) =====================
   COMO ADICIONAR: copie UMA linha da lista abaixo, cole embaixo e troque os dados. Só isso.
     1) Coloque a imagem da capa na pasta definida em PASTA_IMAGENS (padrão: assets/produtos)
     2) Na linha, escreva só o NOME do arquivo em  imagem:"meu-livro.jpg"
   Campos de cada linha:
     tipo      "Livro", "Curso", "E-book", "Mentoria"... qualquer palavra (vira filtro no catálogo)
     titulo    nome do produto (obrigatório)
     descricao frase curta (opcional)
     status    "disponivel" (padrão, não precisa escrever) ou "embreve"
     preco     "R$ 49,90" (opcional)       de  "R$ 79,90" = preço antigo riscado (opcional)
     imagem    só o nome do arquivo da capa (opcional; sem ela aparece uma capa colorida)
               A capa se ADAPTA sozinha à proporção da imagem (16:9, 9:16, 1:1, 3:4...), sem cortar.
     formato   (opcional) força a proporção, ex.: "16:9", "9:16", "1:1", "4:5". Normalmente não precisa.
     url       link de compra. Em "embreve", se tiver url vira o botão "Quero ser avisado"
     botao     texto do botão (opcional; padrão "Comprar agora")
     destaque:true  → aparece também no carrossel do topo (se nenhum tiver, o carrossel mostra todos)
   TODOS os produtos aparecem no "Catálogo completo" no final da página.
   Para esconder tudo: const PRODUTOS=[]; */
const PASTA_IMAGENS="./assets/produtos/";
const PRODUTOS=[
 {tipo:"Livro", titulo:"A Obra Que Redefiniu Uma Geração - Resident Evil 4", descricao:"Um documentário sobre o Resident Evil 4 de 2005.", status:"embreve", imagem:"A Obra Que Redefiniu Uma Geração - Resident Evil 4.png", destaque:true},

 {tipo:"Curso", titulo:"Formação Editor de Vídeo: Técnicas Avançadas e Narrativa Visual", descricao:"Aprenda a criar vídeos profissionais do zero ao acabamento final. Domine técnicas avançadas de montagem, ritmo, narrativa visual, correção de cor e áudio para transformar suas produções em conteúdos de alto impacto.", status:"embreve", imagem:"banner-curso-formacao-editor-1080.png", destaque:true},
];
/* ================== FIM DA ÁREA EDITÁVEL ================== */

/* ---------- Ícone automático para QUALQUER link ---------- */
const ALIAS={"x.com":"x","twitter.com":"x","youtu.be":"youtube","wa.me":"whatsapp","t.me":"telegram","discord.gg":"discord","fb.com":"facebook","pin.it":"pinterest","open.spotify.com":"spotify"};
function iconSources(url){
  const h=new URL(url).hostname.replace(/^www\./,""),p=h.split(".");
  let slug=ALIAS[h];
  if(!slug&&!/(vercel\.app|github\.io|netlify\.app|pages\.dev|ai\.studio)$/.test(h)&&p.length>1)slug=p[p.length-2];
  const s=[];
  if(slug){s.push("https://cdn.simpleicons.org/"+slug,"https://cdn.jsdelivr.net/npm/simple-icons@11/icons/"+slug+".svg")}
  s.push("https://www.google.com/s2/favicons?domain="+h+"&sz=128","https://icons.duckduckgo.com/ip3/"+h+".ico","https://"+h+"/favicon.ico");
  return s;
}

/* ---------- Avatar ---------- */
(function(){
  const av=document.getElementById("av");let i=0;
  av.innerHTML='<span class="mono">DL</span>';
  const img=new Image();img.alt="Duan Lee Dom";img.referrerPolicy="no-referrer";
  img.onload=()=>{av.innerHTML="";av.appendChild(img)};
  img.onerror=()=>{i++;if(i<FOTOS.length)img.src=FOTOS[i]};
  img.src=FOTOS[0];
})();

/* ---------- Produtos: carrossel + catálogo ---------- */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
const imgSrc=i=>!i?"":/^(https?:|\/|\.\.?\/|data:)/.test(i)?i:PASTA_IMAGENS+encodeURIComponent(i);
const noAr=p=>p.status!=="embreve";
function capa(p){
  const c=el("div","cover"),ph=()=>{c.innerHTML="";c.appendChild(el("div","ph",p.tipo||"Produto"))};
  const fix=r=>c.style.setProperty("--arn",r);
  if(p.formato){const [a,b]=String(p.formato).split(/[:x\/]/).map(Number);if(a&&b)fix(a/b)}
  if(p.imagem){const im=new Image();im.alt=p.titulo;im.onerror=ph;
    im.onload=()=>{if(!p.formato&&im.naturalWidth)fix(im.naturalWidth/im.naturalHeight)};
    im.src=imgSrc(p.imagem);c.appendChild(im)}else ph();
  return c;
}
function infoProduto(p){
  const on=noAr(p),info=el("div","info"),chips=el("div","chips");
  if(p.tipo)chips.appendChild(el("span","chip",p.tipo));
  chips.appendChild(el("span","chip "+(on?"ok":"soon"),on?"Disponível":"Em breve"));
  info.appendChild(chips);info.appendChild(el("h3","",p.titulo));
  if(p.descricao)info.appendChild(el("p","",p.descricao));
  const row=el("div","buyrow");
  if(on&&p.preco)row.appendChild(el("span","preco",p.preco));
  const velho=p.de||p.precoAntigo;if(on&&velho)row.appendChild(el("span","old",velho));
  let b;
  if(on&&p.url)b=el("a","btn p",(p.botao||"Comprar agora")+" →");
  else if(!on&&p.url)b=el("a","btn s",p.botao||"Quero ser avisado");
  else b=el("span","btn d","Em breve");
  if(b.tagName==="A"){b.href=p.url;b.target="_blank";b.rel="noopener noreferrer"}
  row.appendChild(b);info.appendChild(row);
  return info;
}
function renderProdutos(root,sec){
  if(!PRODUTOS.length)return;
  const dest=PRODUTOS.filter(p=>p.destaque),lista=dest.length?dest:PRODUTOS;
  if(sec.titulo)root.appendChild(el("h2","gt",sec.titulo));
  const wrap=el("div","prod"),track=el("div","pt");track.setAttribute("aria-label","Produtos");
  lista.forEach(p=>{const slide=el("article","slide");slide.appendChild(capa(p));slide.appendChild(infoProduto(p));track.appendChild(slide)});
  wrap.appendChild(track);root.appendChild(wrap);
  const slides=[...track.children];if(slides.length<2)return;
  const ctrl=el("div","ctrl"),prev=el("button","ar","‹"),next=el("button","ar","›"),dots=el("div","dots");
  prev.setAttribute("aria-label","Anterior");next.setAttribute("aria-label","Próximo");
  slides.forEach((_,i)=>{const d=el("i");d.onclick=()=>go(i);dots.appendChild(d)});
  ctrl.append(prev,dots,next);wrap.appendChild(ctrl);
  let cur=0,paused=false,hold=0;
  const step=()=>slides[1].offsetLeft-slides[0].offsetLeft;
  function mark(i){cur=i;[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i))}
  function go(i){i=(i+slides.length)%slides.length;track.scrollTo({left:slides[i].offsetLeft,behavior:"smooth"});mark(i);hold=Date.now()+8000}
  prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
  track.addEventListener("scroll",()=>{const i=Math.round(track.scrollLeft/step());if(i!==cur&&i>=0&&i<slides.length)mark(i)},{passive:true});
  track.addEventListener("touchstart",()=>{hold=Date.now()+8000},{passive:true});
  wrap.addEventListener("pointerenter",e=>{if(e.pointerType!=="touch")paused=true});
  wrap.addEventListener("pointerleave",()=>{paused=false});
  wrap.addEventListener("focusin",()=>{paused=true});wrap.addEventListener("focusout",()=>{paused=false});
  mark(0);
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches)setInterval(()=>{if(!paused&&Date.now()>hold&&!document.hidden)go(cur+1)},5500);
}
function renderCatalogo(root,sec){
  if(!PRODUTOS.length)return;
  if(sec.titulo)root.appendChild(el("h2","gt",sec.titulo));
  const tipos=[...new Set(PRODUTOS.map(p=>p.tipo||"Outros"))],grid=el("div","catalog"),cards=[];
  PRODUTOS.forEach(p=>{const c=el("article","pcard");c.appendChild(capa(p));c.appendChild(infoProduto(p));grid.appendChild(c);cards.push([c,p.tipo||"Outros"])});
  if(tipos.length>1){
    const f=el("div","filters"),pills=[];
    ["Todos",...tipos].forEach((t,i)=>{
      const b=el("button","pill"+(i?"":" on"),t);
      b.onclick=()=>{pills.forEach(x=>x.classList.remove("on"));b.classList.add("on");cards.forEach(([c,tp])=>{c.hidden=!(i===0||tp===t)})};
      pills.push(b);f.appendChild(b);
    });
    root.appendChild(f);
  }
  root.appendChild(grid);
}

/* ---------- Seções e cards ---------- */
const root=document.getElementById("links");let n=0;
REDES.forEach(sec=>{
  if(sec.produtos){renderProdutos(root,sec);return}
  if(sec.catalogo){renderCatalogo(root,sec);return}
  if(sec.titulo){const t=document.createElement("h2");t.className="gt";t.textContent=sec.titulo;root.appendChild(t)}
  const grid=document.createElement("div");grid.className="grid";
  if(!sec.titulo)grid.style.marginTop="0";
  root.appendChild(grid);
  (sec.links||[]).forEach(r=>{
    const host=new URL(r.url).hostname.replace(/^www\./,"");
    const a=document.createElement("a");
    a.className="card"+((sec.destaque||r.destaque)?" feat":"");a.href=r.url;a.target="_blank";a.rel="noopener noreferrer";
    a.style.animationDelay=(.25+n++*.05)+"s";
    a.innerHTML='<div class="ico"></div><div class="txt"><strong></strong><span></span></div>'+
     '<svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    a.querySelector("strong").textContent=r.nome;
    a.querySelector("span").textContent=r.sub||host;
    const ico=a.querySelector(".ico"),srcs=iconSources(r.url),im=new Image();let k=0;
    ico.innerHTML="<b>"+r.nome[0].toUpperCase()+"</b>";
    im.alt="";im.referrerPolicy="no-referrer";
    im.onload=()=>{ico.innerHTML="";ico.appendChild(im)};
    im.onerror=()=>{k++;if(k<srcs.length)im.src=srcs[k]};
    im.src=srcs[0];
    a.addEventListener("pointermove",e=>{
      if(e.pointerType==="touch")return;
      const b=a.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
      a.style.setProperty("--ry",((x-.5)*12)+"deg");a.style.setProperty("--rx",((.5-y)*12)+"deg");
      a.style.setProperty("--mx",x*100+"%");a.style.setProperty("--my",y*100+"%");
    });
    a.addEventListener("pointerleave",()=>{a.style.setProperty("--rx","0deg");a.style.setProperty("--ry","0deg")});
    grid.appendChild(a);
  });
});

/* ---------- Ações ---------- */
document.getElementById("yr").textContent=new Date().getFullYear();
if(EMAIL){const c=document.createElement("a");c.className="btn s";c.href="mailto:"+EMAIL;c.textContent="Contato";document.getElementById("actions").appendChild(c)}
const toast=document.getElementById("toast");
document.getElementById("share").onclick=async()=>{
  const url=location.href;
  try{
    if(navigator.share){await navigator.share({title:document.title,url});return}
    await navigator.clipboard.writeText(url);
    toast.classList.add("on");setTimeout(()=>toast.classList.remove("on"),1800);
  }catch(e){}
};

/* ---------- Fundo: blocos futuristas que reagem ao mouse ---------- */
(function(){
  const cv=document.getElementById("bg"),cx=cv.getContext("2d");
  const S=46,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W,H,dpr,m={x:-999,y:-999,tx:-999,ty:-999},t=0;
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  addEventListener("resize",size);size();
  addEventListener("pointermove",e=>{m.tx=e.clientX;m.ty=e.clientY});
  addEventListener("pointerleave",()=>{m.tx=m.ty=-999});
  function draw(){
    t+=.012;m.x+=(m.tx-m.x)*.12;m.y+=(m.ty-m.y)*.12;
    cx.clearRect(0,0,W,H);
    const cols=Math.ceil(W/S)+1,rows=Math.ceil(H/S)+1;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const x=i*S,y=j*S,cxm=x+S/2,cym=y+S/2;
      const d=Math.hypot(cxm-m.x,cym-m.y),f=Math.max(0,1-d/240),f2=f*f;
      const w=(Math.sin(t*2+i*.35+j*.28)+1)/2;
      const lift=f2*9,sz=S*.74*(.9+f*.35)+w*2;
      const px=cxm-sz/2+(cxm-m.x)*f2*.12,py=cym-sz/2+(cym-m.y)*f2*.12-lift;
      const hue=190-f*40+w*20;
      if(f>.05){cx.fillStyle="hsla("+hue+",90%,35%,"+(f*.55)+")";cx.fillRect(px,py+lift,sz,sz)}
      cx.fillStyle="hsla("+hue+",90%,60%,"+(.025+w*.03+f*.45)+")";cx.fillRect(px,py,sz,sz);
      cx.strokeStyle="hsla("+hue+",95%,65%,"+(.08+w*.06+f*.7)+")";cx.lineWidth=1;cx.strokeRect(px+.5,py+.5,sz,sz);
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  draw();
})();
</script>
